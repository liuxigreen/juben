# 动作规则配置
# 黑名单改写 + 模板 + 微动作 + 兜底

# 黑名单改写（英文→英文，翻译后应用）
action_rewrite:
  "stands in the scene": "{char} stands behind counter, gaze lowered, breathing slowly"
  "interacts with": "{char} reaches toward"
  "character performs action": "{char} stands behind counter, breathing slowly"
  "all sounds vanish": "{char} closes eyes, fingers tighten around cup rim"
  "all sounds fade to silence": "{char} closes eyes, fingers tighten around cup rim"
  "a vision flashes": "{char} pupils contract, body freezes mid-motion"
  "the scar is still visible": "{char} traces finger across the burn scar on left ring finger"
  "walks contract": "{char} slides contract across counter"
  "suddenly remembers": "{char} eyes widen, body stiffens, breath catches"
  "struggles to remember": "{char} furrows brow, pressing fingers to temples"

# 动作模板（pattern→英文）
action_templates:
  # 咖啡制作
  - {pattern: "擦.*?吧台", en: "{char} wipes the counter with a rag"}
  - {pattern: "擦.*?桌子", en: "{char} wipes a table clean"}
  - {pattern: "磨.*?豆", en: "{char} grinds coffee beans, the grinder humming"}
  - {pattern: "端.*?咖啡|端.*?杯", en: "{char} carries a steaming cup"}
  - {pattern: "端起.*?杯", en: "{char} picks up the cup carefully"}
  - {pattern: "放下.*?杯|杯子.*?放下", en: "{char} sets the cup down on the counter"}
  - {pattern: "倒.*?水|倒.*?咖啡", en: "{char} pours water into a cup"}
  - {pattern: "泡.*?咖啡|泡.*?茶", en: "{char} brews coffee, steam rising"}
  - {pattern: "拉花", en: "{char} draws latte art in the foam"}
  - {pattern: "做好.*?端", en: "{char} finishes preparing and carries the cup over"}
  # 喝/吃
  - {pattern: "喝了一口|喝了一", en: "{char} takes a slow sip"}
  - {pattern: "喝完|一饮而尽", en: "{char} drains the cup in one gulp"}
  - {pattern: "端起来.*?闭眼|端起.*?闭", en: "{char} lifts the cup and closes eyes"}
  # 身体动作
  - {pattern: "闭眼$|闭上眼$|闭上眼睛$", en: "{char} slowly closes eyes"}
  - {pattern: "睁开眼|猛地睁开", en: "{char} snaps eyes open"}
  - {pattern: "转身", en: "{char} turns around"}
  - {pattern: "回头", en: "{char} turns head back"}
  - {pattern: "走进来?|走入|走进", en: "{char} walks through the door"}
  - {pattern: "走出去|走出|出了门", en: "{char} walks out the door"}
  - {pattern: "站起来?|起身", en: "{char} stands up from the seat"}
  - {pattern: "坐[到在下]", en: "{char} sits down"}
  - {pattern: "蹲[下去]", en: "{char} crouches down"}
  - {pattern: "弯腰", en: "{char} bends down"}
  - {pattern: "追出去|追[了出来]", en: "{char} runs out after someone"}
  - {pattern: "离开|走了", en: "{char} turns and leaves"}
  # 头部/面部
  - {pattern: "点头", en: "{char} nods slowly"}
  - {pattern: "摇头", en: "{char} shakes head"}
  - {pattern: "低头看|低头", en: "{char} looks down"}
  - {pattern: "抬头", en: "{char} looks up"}
  - {pattern: "盯着|注视", en: "{char} stares intently"}
  - {pattern: "皱眉", en: "{char} frowns"}
  - {pattern: "微笑|笑了", en: "{char} smiles faintly"}
  - {pattern: "愣住|愣了", en: "{char} freezes mid-motion"}
  - {pattern: "脸色.*?白|脸白了", en: "{char} goes pale"}
  - {pattern: "流泪|哭了?|泪.*?下", en: "{char} tears roll down cheeks"}
  - {pattern: "擦.*?泪", en: "{char} wipes tears from eyes"}
  - {pattern: "深吸一口气", en: "{char} takes a deep breath"}
  # 手部
  - {pattern: "攥紧|握紧", en: "{char} clenches fists tightly"}
  - {pattern: "发抖|颤抖", en: "{char} trembles visibly"}
  - {pattern: "手指.*?敲", en: "{char} taps fingers rhythmically on counter"}
  - {pattern: "伸手.*?摸|伸手.*?触", en: "{char} reaches out to touch gently"}
  - {pattern: "翻.*?手|翻过.*?手", en: "{char} turns hand over to inspect"}
  - {pattern: "手.*?停", en: "{char} hand pauses mid-motion"}
  - {pattern: "指甲.*?掐|指甲.*?陷", en: "{char} digs fingernails into palm"}
  - {pattern: "掏.*?手机", en: "{char} pulls out phone"}
  - {pattern: "打字|在.*?打字", en: "{char} types on phone screen"}
  - {pattern: "扫码", en: "{char} scans QR code on phone"}
  - {pattern: "攥.*?钥匙", en: "{char} grips keys tightly"}
  - {pattern: "揭.*?便签", en: "{char} peels sticky note off the wall"}
  # 物体交互
  - {pattern: "水龙头|开水|打开.*?水", en: "{char} turns on the faucet"}
  - {pattern: "冲洗|冲掉", en: "{char} rinses under running water"}
  - {pattern: "擦干", en: "{char} dries hands with a towel"}
  - {pattern: "收拾|收.*?杯子", en: "{char} clears cups from the table"}
  - {pattern: "叠.*?抹布", en: "{char} folds the cleaning rag"}
  - {pattern: "洗.*?杯", en: "{char} washes a cup under running water"}
  - {pattern: "锁.*?门", en: "{char} locks the front door"}
  - {pattern: "翻.*?合同|翻.*?文件", en: "{char} flips through contract pages"}
  - {pattern: "推.*?名片|推.*?信封|推.*?纸", en: "{char} slides an envelope across the counter"}
  - {pattern: "接过.*?名片|接过.*?信封", en: "{char} takes the envelope"}
  - {pattern: "展开.*?画|打开.*?画", en: "{char} unrolls a painting on the counter"}
  - {pattern: "收起.*?画|卷.*?画", en: "{char} rolls up the painting"}
  # 感官
  - {pattern: "注意到|发现", en: "{char} notices something unexpected"}
  - {pattern: "看到|望见", en: "{char} sees something"}
  - {pattern: "听到", en: "{char} hears a sound"}
  - {pattern: "想起来|想起来了", en: "{char} suddenly remembers"}
  - {pattern: "想不起来|不记得", en: "{char} struggles to remember"}
  # 环境
  - {pattern: "门铃", en: "the doorbell chimes"}
  - {pattern: "风铃", en: "the wind chimes ring softly"}
  - {pattern: "灯.*?灭|灯.*?暗", en: "the lights flicker and go out"}
  - {pattern: "灯.*?亮|灯.*?重新", en: "the lights come back on"}
  - {pattern: "冒热气|冒着热", en: "steam rises from the cup"}
  - {pattern: "涟漪", en: "ripples spread across the coffee surface"}
  - {pattern: "便签.*?淡|字迹.*?淡", en: "the handwriting on the sticky note fades by one stroke"}
  - {pattern: "便签.*?掉|便签.*?落", en: "the sticky note falls from the wall"}
  # 痕迹/图腾
  - {pattern: "疤痕.*?消失|疤痕.*?没了", en: "the scar on the skin has vanished"}
  - {pattern: "印痕.*?消失|印.*?消失", en: "the mark has disappeared"}
  - {pattern: "口红印|唇印", en: "a faint lipstick mark on the cup rim"}
  - {pattern: "墨渍", en: "a small ink stain on the suit cuff"}
  - {pattern: "痣.*?消失|痣.*?没", en: "the mole has vanished from the skin"}
  # 手机/通讯
  - {pattern: "手机.*?震|手机.*?响", en: "the phone buzzes on the counter"}
  - {pattern: "消息|收到.*?消息", en: "a message notification on screen"}
  - {pattern: "回拨|拨打", en: "{char} dials the number again"}
  - {pattern: "挂了|挂断", en: "the call disconnects"}
  # 多人互动
  - {pattern: "接过.*?杯", en: "{char} accepts the cup"}
  - {pattern: "递给|推给", en: "{char} hands over"}
  - {pattern: "叫住|拦住", en: "{char} calls out to stop someone"}
  - {pattern: "弯腰.*?耳边|贴.*?耳边", en: "{char} leans close and whispers"}
  - {pattern: "挥手", en: "{char} waves goodbye"}
  - {pattern: "跪[下来说]", en: "{char} kneels down"}

