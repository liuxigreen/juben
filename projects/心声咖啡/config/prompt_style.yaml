# Prompt渲染风格配置

# 当前使用的renderer
active_renderer: "flow_character_v2"

# 多renderer定义
renderers:
  flow_character_v2:
    description: "Google Flow — 角色引用型：长相由 Flow 角色系统保证，提示词只引用角色名"
    style: "hybrid"
    character_first: true
    character_mode: "reference"
    suffix: "cinematic, 9:16 vertical, photorealistic, 4K, 24fps, shallow depth of field"

  veo_v1:
    description: "Google Veo — 叙事型，完整句子"
    style: "narrative"
    character_first: true
    suffix: "cinematic, 9:16 vertical, photorealistic, 4K"

  kling_v1:
    description: "Kling — 关键词型，逗号分隔"
    style: "keyword"
    character_first: false
    suffix: "9:16, cinematic, high quality"

  flow_v1:
    description: "Google Flow — 混合型，叙事+技术参数"
    style: "hybrid"
    character_first: true
    suffix: "cinematic, 9:16 vertical, photorealistic, 4K, 24fps, shallow depth of field"

  runway_v1:
    description: "Runway — 简洁型"
    style: "concise"
    character_first: false
    suffix: "cinematic, vertical format"

# 情绪映射
emotion_map:
  Shock: ["猛地", "突然", "瞳孔", "愣住", "震惊", "吓"]
  Tension: ["攥紧", "心跳", "发抖", "紧张", "害怕"]
  Sadness: ["泪", "哭", "痛", "悲伤"]
  Warmth: ["微笑", "温暖", "开心", "笑了"]
  Mystery: ["消失", "淡了", "模糊", "听不清", "神秘"]

space_map:
  Mental: ["世界安静", "声音消失", "脑海", "画面闪过", "画面碎了"]
  Transition: ["闭眼", "端起.*?杯"]

# 情绪→景别
emotion_shot_map:
  Shock: "CU"
  Tension: "MCU"
  Sadness: "MCU"
  Warmth: "MS"
  Neutral: "MS"
  Mystery: "CU"

# 情绪→运镜
emotion_camera_map:
  Shock: "rapid_push"
  Tension: "push"
  Sadness: "pull"
  Warmth: "static"
  Neutral: "static"
  Mystery: "push"

# 情绪→光影
emotion_lighting_map:
  Shock: "High contrast"
  Tension: "Low key"
  Sadness: "Low key"
  Warmth: "Warm"
  Neutral: "Natural"
  Mystery: "Low key"

# 运镜语义映射
camera_semantic_map:
  leaves: "pull"
  walks out: "pull"
  exits: "pull"
  turns and leaves: "pull"
  opens eyes: "rapid_push"
  discovers: "rapid_push"
  notices: "rapid_push"
  snaps eyes open: "rapid_push"
  stares: "static"
  gazes: "static"
  looks down: "static"
  looks up: "static"
  reaches out: "push"
  touches: "push"
  picks up: "push"
  closes eyes: "static"
  trembles: "handheld"

# 配音情绪
voice_emotion_map:
  Neutral: "calm, conversational"
  Tension: "whispered, restrained, breathing heavy"
  Shock: "sharp intake of breath, voice breaking"
  Sadness: "soft, trailing off, voice cracking"
  Warmth: "gentle, warm tone"
  Mystery: "low, deliberate, pauses between words"

# Beat合并策略
beat_merge:
  max_shots_per_chapter: 22
  never_merge:
    - ability_activation
    - focus_object_change
    - location_change
    - chapter_end_hook

# ═══════════════════════════════════════════════════════════
# 音频 / 口型控制（Veo 3.1 适配）
# ═══════════════════════════════════════════════════════════
# mode 切换（通用化，换项目只改这一行）：
#   dubbed_en : 出海模式——Veo 直接生成英文配音+英文口型(sub-10ms最强)，字幕另配
#   post_dub  : 后期配音模式——嘴动不吐词/锁嘴，配音在剪映后期做(适合中文等弱势语言)
audio_control:
  enabled: true
  mode: dubbed_en
  accent: "American accent"

  # ---- dubbed_en：英文口播模式 ----
  dubbed_en:
    # onscreen：引用英文台词，要求自然口型 + 情绪语气
    # 说话镜头景别下限 MCU（近景利于展示口型对齐，Veo英文lip-sync够强）
    onscreen_tpl: "{speaker} looks and speaks, saying: \"{line_en}\", {tone} delivery, natural lip sync, {accent}"
    # 多角色：只让说话者开口，其他人静默倾听（Veo多人对话易乱）
    onscreen_multi_tpl: "{speaker} speaks, saying: \"{line_en}\", {tone} delivery, natural lip sync, {accent}; {others} stay silent with closed lips, listening"
    # inner_voice：心声=画外音(voiceover)，人物不动嘴，世界骤静
    inner_voice_tpl: "{speaker} stays silent with lips closed, a {tone} inner-monologue voiceover: \"{line_en}\", {accent}"
    none_mouth: "lips closed, no speaking"
    # 音轨：说话镜头压环境音突出人声；无台词镜头给环境音
    dialogue_audio: "clean dialogue, minimal room tone, no music"
    inner_voice_audio: "near silence, ambient sound fading out, voiceover only, no music"
    ambient_suffix: "ambient sound only, no music, no dialogue"
    dialogue_shot_floor: "MCU"

  # ---- post_dub：后期配音模式（保留，切换用）----
  post_dub:
    mouth_map:
      onscreen: "speaking naturally, visible mouth movement, no discernible words"
      inner_voice: "lips closed, silent, contemplative expression"
      none: "lips closed, silent"
    audio_suffix: "ambient sound only, no music, no spoken words"
    inner_voice_audio: "near silence, ambient sound fading out, no music, no voices"
    dialogue_shot_floor: "MCU"

  # location → 环境音（两模式共用）
  ambient_map:
    "Nianxiang coffee shop": "faint espresso machine hum, distant street traffic"
    "cramped noodle restaurant": "sizzling wok, exhaust fan droning, clinking bowls"
    "dark narrow alley at night": "distant city hum, dripping water, faint wind"
    "rain-soaked alley outside the coffee shop": "steady rain, water dripping from eaves"
    "small park": "birdsong, rustling leaves, distant children"
  default_ambient: "quiet room tone"
  # 情绪→英文语气词（配音语气）
  tone_map:
    Shock: "startled, sharp"
    Tension: "tense, low"
    Sadness: "soft, wavering"
    Warmth: "warm, gentle"
    Mystery: "hushed, uneasy"
    Neutral: "calm, even"
