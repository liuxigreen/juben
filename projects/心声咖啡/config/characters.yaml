# 心声咖啡 — 角色定妆表（Flow 角色创建用）
#
# 用法：
#   ① 定妆层：把每个角色的 flow_portrait 提示词丢进 Flow 的"角色/Ingredients"，
#      生成参考图并命名（如 "Su Nian"）。这一步每个角色只做一次。
#   ② 分镜层：镜头提示词只引用角色名（en 字段），不再重复长相描述。
#
# 字段说明：
#   en           : Flow 里的角色命名（英文，唯一）
#   flow_portrait: 定妆提示词——喂给 Flow 角色系统生成参考图（超详细，一次性）
#   short        : 分镜里万一需要极简提示时用（通常不用，Flow 靠角色名保持一致）
#   pronouns     : 剧本正则兜底用（agent-as-LLM 语义 beats 已不依赖，保留兼容）

苏念:
  en: "Su Nian"
  role: "protagonist"
  gender: "female"
  flow_portrait: >-
    A 26-year-old Chinese woman, soft round face with gently defined cheekbones,
    warm ivory skin, double-lidded almond eyes that look slightly tired but alert,
    natural straight eyebrows, a small unpainted mouth. Shoulder-length straight
    black hair with a center part, a few strands tucked behind her ear. Slender build,
    around 165cm. Wears a faded oatmeal-beige linen apron over a plain white long-sleeve
    tee, sleeves pushed to the elbows. A thin burn scar on her left ring finger.
    Quiet, watchful, a little melancholic; the look of someone who listens more than
    she speaks. Soft natural lighting, photorealistic, cinematic portrait.
  short: "young barista, beige linen apron, burn scar on ring finger"
  flow_voice: "Soft, low, slightly husky female voice, measured and quiet, a subtle weariness beneath, American accent"
  pronouns: ["她", "姑娘", "女孩", "老板", "围裙"]

顾深:
  en: "Gu Shen"
  role: "supporting"
  gender: "male"
  flow_portrait: >-
    A 30-year-old Chinese man, tall (around 183cm) and lean, angular clean-shaven
    face with a sharp jawline and high nose bridge, calm grey-toned eyes that shift
    to light brown in warm light, thin controlled lips. Short neat black hair, side-parted.
    Wears a well-tailored charcoal-grey wool suit, a deep navy tie slightly loosened,
    a crisp white shirt. A visible callus on his right index finger. Composed, precise,
    emotionally reserved — like a mathematician who never shows his cards.
    Soft window light, photorealistic, cinematic portrait.
  short: "tall man, charcoal suit, calm grey eyes"
  flow_voice: "Calm, deep, controlled male voice, precise and clipped, emotionally restrained, American accent"
  pronouns: ["他", "男人", "西装男", "灰色西装", "顾客", "西装", "领带"]

林可:
  en: "Lin Ke"
  role: "supporting"
  gender: "female"
  flow_portrait: >-
    A 25-year-old Chinese woman, lively oval face with bright expressive eyes,
    light freckles across the nose, a wide easy smile. Long dark-brown hair pulled
    into a loose high ponytail with a few flyaway strands. Colorful painted nails
    (each a different pastel shade, some with tiny stars), edges slightly bitten.
    Casual layered style — an oversized mustard cardigan over a graphic tee, a large
    canvas art bag slung across her body. Warm, protective, talks fast.
    Natural daylight, photorealistic, cinematic portrait.
  short: "ponytail, colorful nails, mustard cardigan, art bag"
  flow_voice: "Bright, warm, fast-paced female voice, energetic and expressive, American accent"
  pronouns: ["她"]

陈锐:
  en: "Chen Rui"
  role: "antagonist"
  gender: "male"
  flow_portrait: >-
    A 32-year-old Chinese man, strong square jaw, close-cropped black hair with a
    receding hairline just starting, heavy brows, tired eyes with faint crow's feet,
    a permanent faint frown. Broad-shouldered, medium height. Wears a dark navy
    polo shirt under a slate-grey blazer, an expensive steel-and-leather watch on
    his left wrist. Grinds his jaw when tense. Outwardly hard and transactional, but
    carries the weariness of a man who gave something up long ago.
    Cool office lighting, photorealistic, cinematic portrait.
  short: "square jaw, cropped hair, navy polo, expensive watch"
  flow_voice: "Gruff, low, hard-edged male voice, transactional and world-weary, American accent"
  pronouns: ["他"]

苏远:
  en: "Su Yuan"
  role: "supporting"
  gender: "male"
  flow_portrait: >-
    A Chinese boy around 8-9 years old, round childish face with soft cheeks,
    bright crescent eyes that curve when he smiles, a small gap where a baby tooth
    is missing, short neat black hair. Wears a simple striped cotton tee. Warm,
    gentle, protective older-brother energy. In older references, a faint echo of
    the same features aged into late teens. Soft nostalgic lighting, slightly faded
    film look, photorealistic portrait.
  short: "young boy, round face, gap tooth, warm crescent-eyed smile"
  flow_voice: "Young boy's voice around 8 years old, soft and gentle, American accent"
  pronouns: ["他"]

外婆:
  en: "Grandmother"
  role: "supporting"
  gender: "female"
  flow_portrait: >-
    An elderly Chinese woman in her early 70s, gentle deeply-lined face, warm
    crinkled smiling eyes, silver-white hair pinned back neatly. Wears a well-worn
    cornflower-blue cotton apron over a soft grey cardigan, sleeves rolled. Often
    holds a copper coffee kettle. Kind, unhurried, radiates the warmth of an old
    coffee shop. Golden warm light, soft focus, nostalgic photorealistic portrait.
  short: "elderly woman, white hair, blue apron"
  flow_voice: "Elderly female voice in her 70s, gentle, unhurried, warm, American accent"
  pronouns: ["她"]
