# 竖屏短剧节奏模板
# 适用于：YouTube Shorts / TikTok / 红果 / 抖音 / 快手
# 单集时长：60-120秒
# 单集字数：500-900字台词本体（90秒 × 约7字/秒语速上限，爆款对齐）

name: vertical-drama
description: "竖屏短剧节奏模板 — 双轴校验（字数轴+秒数轴）"
version: "1.0"

# ============================================================
# 节奏卡点（双轴）
# ============================================================
pacing_checkpoints:
  # 爆款对齐：5点扩到9点，字数轴按 90s ≈ 500-900 字台词本体校准
  - label: "3s_Hook"
    word_range: [0, 50]
    time_range: [0, 3]
    rule: "动词+特写开局。禁止背景铺垫。钩子画面3秒内成立（坠落感/疼痛/重生的眩晕/血/碎裂声）"
    emotion: "震惊/恐惧"
    shot_type: "CU"
    camera_movement: "static"

  - label: "15s_Conflict"
    word_range: [80, 160]
    time_range: [12, 18]
    rule: "第一次冲突升级：立场交锋开始，15秒内必须出现新信息"
    emotion: "愤怒/不甘"
    shot_type: "CU"
    camera_movement: "push"

  - label: "30s_Retention"
    word_range: [170, 300]
    time_range: [25, 35]
    rule: "信息差炸弹（主角知道但旁人不知道）+第一次小反转"
    emotion: "掌控感/暗爽"
    shot_type: "MCU"
    camera_movement: "push"

  - label: "45s_Escalation"
    word_range: [300, 420]
    time_range: [40, 50]
    rule: "打脸前蓄力：施辱者把赌注/羞辱抬到最高，情绪压到临界点"
    emotion: "压抑/蓄力"
    shot_type: "CU"
    camera_movement: "static"

  - label: "60s_Explosion"
    word_range: [430, 560]
    time_range: [55, 65]
    rule: "爆点：打脸/揭露/物理冲击，必须有当众翻转或物理位移"
    emotion: "紧张/爆发"
    shot_type: "MS"
    camera_movement: "whip_pan"

  - label: "75s_Satisfaction"
    word_range: [560, 680]
    time_range: [70, 78]
    rule: "爽点兑现+旁观者反应镜头（惊呼/下跪/改口称呼），给足反应特写"
    emotion: "暗爽/掌控"
    shot_type: "MCU"
    camera_movement: "pull"

  - label: "82s_Twist"
    word_range: [680, 780]
    time_range: [78, 85]
    rule: "新变量插入：第二次反转或更大敌人现身，爽点之后立刻拉新钩子"
    emotion: "错愕/期待"
    shot_type: "CU"
    camera_movement: "push"

  - label: "90s_Cliffhanger"
    word_range: [780, 900]
    time_range: [85, 90]
    rule: "断崖钩子。最后一句植入具体的未回答问题或突发事件，卡在观众最想看下一口气的位置"
    emotion: "悬念/紧迫"
    shot_type: "CU"
    camera_movement: "push"

# ============================================================
# 断崖类型
# ============================================================
cliffhanger_types:
  - type: "question"
    description: "未回答的问题"
    example: "她到底是谁？"
  - type: "reveal"
    description: "信息揭露"
    example: "原来，他才是真正的..."
  - type: "shock"
    description: "突发事件"
    example: "门突然被踢开。"
  - type: "action"
    description: "动作中断"
    example: "她举起手——"

# ============================================================
# 死帧熔断规则
# ============================================================
dead_frame_rules:
  segment_size: 200          # 每200字检测一次
  min_physical_actions: 2    # 最少2个物理动作
  physical_actions:          # 物理动作词库
    - 推
    - 拉
    - 握
    - 砸
    - 转身
    - 跪
    - 站
    - 走
    - 跑
    - 颤抖
    - 瞳孔收缩
    - 泼
    - 摔
    - 踢
    - 扇
    - 掐
    - 冲
    - 扑
  non_physical_actions:      # 非物理动作（镜头拍不出来）
    - 感到
    - 觉得
    - 认为
    - 意识到
    - 心中暗想
    - 不禁感叹

# ============================================================
# 镜头规则
# ============================================================
shot_rules:
  max_duration: 15           # 单镜头最长15秒
  min_duration: 1.5          # 单镜头最短1.5秒
  preferred_types:           # 竖屏偏好景别
    - "CU"                   # 特写（40%）
    - "MCU"                  # 近景（30%）
    - "MS"                   # 中景（20%）
    - "FS"                   # 全景（10%）
  camera_variation:          # 相邻镜头运镜必须变化
    - ["push", "pull"]
    - ["static", "handheld"]
    - ["push", "pan"]

# ============================================================
# 情绪曲线比例（参考0xsline）
# ============================================================
emotion_curve:
  # 15-30-35-20 比例
  opening_tension: 15        # 开局紧张（0-15%）
  rising_action: 30          # 上升动作（15-45%）
  climax: 35                 # 高潮（45-80%）
  resolution_hook: 20        # 断崖钩子（80-100%）
